<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Google Sans font enablement for headless diagram rendering
  (Graphviz, Mermaid/Chrome, cairosvg).

  WHY THIS FILE EXISTS
  fontconfig on this machine does NOT scan the user font directory. Without
  this config, `fc-match "Google Sans"` silently returns Noto Sans and every
  rendered diagram ships in the wrong typeface. That is a silent brand
  failure, easy to miss because the output still looks plausible.

  KNOWN TRAP (verified 2026-08-20)
  Inside the agent sandbox the HOME environment variable is EMPTY, so
  fontconfig cannot expand a tilde and cannot resolve prefix="xdg". Both of
  the following FAIL and fall back to Noto Sans:
        dir      : tilde slash .local/share/fonts
        dir      : prefix="xdg" fonts
  Only an ABSOLUTE dir path works. That is why the path below is absolute.

  SECOND TRAP: XML comments may not contain a double hyphen. Keep prose in
  this header free of them.

  PORTABILITY
  scripts/render_graph.py regenerates this file at runtime with font
  directories resolved for the current user (it derives the real home via
  pwd.getpwuid when HOME is empty), so the pipeline stays portable. This
  checked in copy is the working default for this workstation and doubles as
  documentation of the fix.

  USAGE
      export FONTCONFIG_FILE=<skill>/assets/fontconfig/fonts.conf
      fc-match "Google Sans"        # MUST print Google Sans, not Noto Sans

  Families enabled: Google Sans (headings), Google Sans Text (body/labels),
  Google Sans Mono and Google Sans Code (code), Google Sans Flex (display).
-->
<fontconfig>

  <!-- Absolute path only. Tilde and xdg prefixes do not expand when HOME is empty. -->
  <dir>/usr/local/google/home/sanchitalekh/cowork_workspace/skills/ai-tech-gtm-collateral/assets/fonts</dir>

  <!-- Inherit the system font set (DejaVu, Noto, Liberation and friends). -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- Writable cache. The user cache dir is read only in the sandbox. -->
  <cachedir>/tmp/twg-fontconfig-cache</cachedir>

  <!-- Brand default: a generic sans request resolves to Google Sans Text. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Google Sans Text</string>
    </edit>
  </match>

  <!-- Route common non brand sans requests onto the brand face, so Mermaid and
       Graphviz themes that hardcode Helvetica, Arial or Roboto still render
       on brand instead of silently drifting off palette. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Google Sans Text</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Google Sans Text</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Roboto</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Google Sans Text</string>
    </edit>
  </match>

  <!-- Monospace default. -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Google Sans Mono</string>
    </edit>
  </match>

</fontconfig>
